nodes:
  - id: water.ionization-kw
    title: 水的电离平衡与离子积常数Kw
    kind: 概念
    objective: 掌握水的微弱电离过程，理解离子积常数Kw定义与温度唯一决定性
    problem: 纯水为什么能导电？常温下为什么说水分子绝大多数以分子形态存在？
    prerequisites: []
    concepts:
      - 自偶电离
      - 弱电解质电离平衡
      - 水的离子积常数Kw
      - 吸热过程与温度影响
    practice: 理解微观图景与吸热本质，完成概念辨析随堂测试
    pitfalls:
      - 误认为Kw随溶液酸碱度变化
      - 混淆纯水在中性时的氢离子浓度与常温限定条件
    realworld: 超纯水电阻率检测、人体细胞内液离子平衡
    过关标准:
      - 能够准确书写水的电离平衡方程式并解释吸热原因
      - 能够说明升温对Kw、c(H+)、c(OH-)的具体变化方向
    status: 学习中
    mastery: 0.2

  - id: water.equilibrium-shift
    title: 外界条件对水电离平衡的影响与计算
    kind: 模型
    objective: 掌握温度、酸、碱、盐对水电离平衡移动方向的判断与水电离离子浓度计算
    problem: 向水中加入0.1 mol/L盐酸后，由水电离出的氢离子浓度是多少？
    prerequisites:
      - water.ionization-kw
    concepts:
      - 同离子效应
      - 水解消耗平衡移动
      - 水电离出的c_水(H+)与溶液总c(H+)区分
    practice: 讲练结合，掌握酸碱盐溶液中水电离浓度的速算模型
    pitfalls:
      - 误将酸溶液中总的c(H+)当作由水电离出的氢离子
      - 忽略弱酸弱碱盐水解对水电离的促进作用
    realworld: 酸雨对土壤与天然水体的酸化影响
    过关标准:
      - 能推导25℃下0.01 mol/L NaOH溶液中由水电离出的c_水(OH-)
      - 能准确判断外加酸、碱、强酸弱碱盐对水电离程度的抑制或促进
    status: 未开始
    mastery: 0.0

  - id: water.ph-and-neutrality
    title: 溶液酸碱性本质与pH核心辨析
    kind: 母题
    objective: 掌握中性本质c(H+)=c(OH-)，破除常温定势，攻克pH母题
    problem: 100℃下pH=7的溶液究竟显中性、酸性还是碱性？
    prerequisites:
      - water.equilibrium-shift
    concepts:
      - 中性本质
      - pH概念与对数计算
      - 100℃下的Kw与pH中性点
      - 电荷守恒与离子浓度比较
    practice: 高考经典真题母题拆解与陷阱辨析
    pitfalls:
      - 机械记忆pH=7为中性而忽视温度前提
    realworld: 发酵工业发酵液pH精密在线监控
    过关标准:
      - 能准确计算100℃下纯水的pH值并判定pH=7溶液的酸碱性
      - 独立完成随堂压轴母题演练
    status: 未开始
    mastery: 0.0

edges:
  - from: water.ionization-kw
    to: water.equilibrium-shift
    reason: 掌握Kw的定义与本质是分析外加溶质对平衡移动影响的前提
  - from: water.equilibrium-shift
    to: water.ph-and-neutrality
    reason: 掌握外加条件与离子浓度计算是全面理解溶液酸碱性与高考母题的基础
